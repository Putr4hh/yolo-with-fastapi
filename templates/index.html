<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YOLO FastAPI Camera Stream</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top, #1e293b, #020617);
            color: #e5e7eb;
        }
        :root {
            color-scheme: dark;
        }
        .container {
            max-width: 1200px;
            width: calc(100% - 3rem);
            background: rgba(15, 23, 42, 0.95);
            border-radius: 1.25rem;
            padding: 1.75rem 2rem 2rem;
            box-shadow:
                0 20px 25px -5px rgba(15, 23, 42, 0.9),
                0 8px 10px -6px rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.25);
            backdrop-filter: blur(14px);
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.25rem;
        }
        .title-group h1 {
            font-size: 1.6rem;
            margin: 0 0 0.35rem 0;
            letter-spacing: 0.03em;
        }
        .title-group p {
            margin: 0;
            font-size: 0.9rem;
            color: #9ca3af;
        }
        .badge {
            padding: 0.35rem 0.7rem;
            border-radius: 999px;
            font-size: 0.75rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: linear-gradient(to right, #22c55e, #3b82f6);
            color: #0b1120;
            font-weight: 600;
            white-space: nowrap;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.9rem;
        }
        .btn {
            border: none;
            border-radius: 999px;
            padding: 0.45rem 0.9rem;
            font-size: 0.8rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            background: rgba(30, 64, 175, 0.95);
            color: #e5e7eb;
            border: 1px solid rgba(129, 140, 248, 0.7);
            transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease, color 0.15s ease;
        }
        .btn:hover {
            background: rgba(59, 130, 246, 1);
            box-shadow: 0 0 0 1px rgba(129, 140, 248, 0.9);
            transform: translateY(-1px);
        }
        .btn.secondary {
            background: transparent;
            border-color: rgba(75, 85, 99, 0.9);
        }
        .btn.secondary:hover {
            background: rgba(31, 41, 55, 0.9);
        }
        .btn.danger {
            background: rgba(185, 28, 28, 0.95);
            border-color: rgba(248, 113, 113, 0.9);
        }
        .btn.danger:hover {
            background: rgba(220, 38, 38, 1);
        }
        .btn-icon {
            font-size: 0.9rem;
        }
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8rem;
            color: #9ca3af;
        }
        .status-dot {
            width: 0.45rem;
            height: 0.45rem;
            border-radius: 999px;
            background: #fbbf24;
            box-shadow: 0 0 8px #fbbf24;
        }
        .status-dot.online {
            background: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }
        .status-dot.offline {
            background: #ef4444;
            box-shadow: 0 0 8px #ef4444;
        }
        .video-wrapper {
            position: relative;
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid rgba(148, 163, 184, 0.35);
            background: #020617;
        }
        .video-wrapper img {
            display: block;
            width: 100%;
            height: auto;
        }
        .overlay-gradient {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(to top, rgba(15, 23, 42, 0.85), transparent 40%);
        }
        .loading-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, rgba(15, 23, 42, 0.98), rgba(15, 23, 42, 0.96));
            color: #9ca3af;
            font-size: 0.9rem;
            gap: 0.6rem;
        }
        .spinner {
            width: 1.1rem;
            height: 1.1rem;
            border-radius: 999px;
            border: 2px solid rgba(55, 65, 81, 0.9);
            border-top-color: #38bdf8;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.9rem;
            font-size: 0.8rem;
            color: #9ca3af;
        }
        .info-bar-left span {
            margin-right: 0.75rem;
        }
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.25rem 0.7rem;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(55, 65, 81, 0.75);
            color: #e5e7eb;
        }
        .dot {
            width: 0.5rem;
            height: 0.5rem;
            border-radius: 999px;
            background: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }
        footer {
            margin-top: 0.5rem;
            font-size: 0.75rem;
            color: #6b7280;
            text-align: right;
        }
        @media (max-width: 768px) {
            .container {
                padding: 1.25rem 1.1rem 1.5rem;
                width: calc(100% - 1.5rem);
            }
            header {
                flex-direction: column;
                align-items: flex-start;
            }
            .title-group h1 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="title-group">
                <h1>YOLO Object Detection Stream</h1>
                <p>Real-time kamera + FastAPI + Ultralytics YOLO</p>
            </div>
            <div class="badge">LIVE</div>
        </header>

        <div class="controls">
            <button id="btn-play" class="btn">
                <span class="btn-icon">▶</span>
                <span>Start Stream</span>
            </button>
            <button id="btn-pause" class="btn danger">
                <span class="btn-icon">⏸</span>
                <span>Stop Stream</span>
            </button>
            <button id="btn-fullscreen" class="btn secondary">
                <span class="btn-icon">⤢</span>
                <span>Fullscreen</span>
            </button>
            <span class="status-indicator">
                <span id="status-dot" class="status-dot"></span>
                <span id="status-text">Menunggu koneksi...</span>
            </span>
        </div>

        <div class="video-wrapper">
            <img id="stream-img" src="/video_feed" alt="YOLO camera stream" />
            <div class="overlay-gradient"></div>
            <div id="loading-overlay" class="loading-overlay" style="display: flex;">
                <div class="spinner"></div>
                <span>Menghubungkan ke kamera...</span>
            </div>
        </div>

        <div class="info-bar">
            <div class="info-bar-left">
                <span>Tekan <strong>Ctrl + C</strong> di terminal untuk menghentikan server.</span>
            </div>
            <div class="pill">
                <span class="dot"></span>
                <span>Streaming dari webcam</span>
            </div>
        </div>

        <footer>
            YOLO FastAPI Demo &middot; Threshold: __CONF_THRESHOLD__
        </footer>
    </div>
    <script src="/static/main.js"></script>
</body>
</html>
